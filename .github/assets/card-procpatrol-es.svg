  <text x="40" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#f2f4f7">ProcPatrol</text>
  <text x="40" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#a3acb9">Monitoreo de disponibilidad basado en heartbeats. Los servicios se reportan periódicamente y sus</text>
  <text x="40" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#a3acb9">responsables reciben una alerta por correo, SMS, Discord o Slack cuando uno deja de hacerlo.</text>
  <text x="40" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1" fill="#f5b700">MI ROL</text>
  <text x="130" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f2f4f7">Desarrollador backend: diseño del modelo de heartbeats, persistencia con MySQL, alertas por</text>
  <text x="130" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f2f4f7">SMS con Twilio</text>
